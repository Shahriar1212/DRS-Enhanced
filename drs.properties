# ------------------------------------------------------------------
# DRS-Enhanced configuration (read by both the server and the client)
# ------------------------------------------------------------------
# Server socket the client connects to
server.host=localhost
server.port=5050
# Size of the server worker-thread pool (max concurrent clients)
server.threads=20

# MySQL connection used by the server. The database and all tables are
# created automatically on first start-up.
# Create this account once by running database/00_create_app_user.sql as root,
# OR change db.user/db.password to your own MySQL account (e.g. root).
db.host=localhost
db.port=3306
db.name=drs_enhanced
db.user=drs_user
db.password=Drs@2026

# AES-256 master key for field encryption (created automatically if missing)
security.keyFile=security/drs-master.key
# Minutes of inactivity before a login session expires
session.timeoutMinutes=30
